## Example nginx config for todo behind HTTPS (HTTP/2, HTTP/3, HSTS).
## Replace todo.example.com and the certificate paths with your own.

## Catch-all for foreign Host headers. The app derives the passkeys' RP ID and
## allowed origin from the Host header — without a default_server, any domain
## pointing at this IP reaches the upstream and could register the first
## passkey of a not-yet-set-up instance under a foreign RP ID.
##
## Do NOT enable blindly: if another vhost on this nginx is already the
## default_server for :80/:443, nginx refuses to start ("duplicate default
## server"). Check `grep -r default_server /etc/nginx` first, then enable this
## block (or use the existing catch-all).
#server {
#    listen 80 default_server;
#    listen [::]:80 default_server;
#    listen 443 ssl default_server;
#    listen [::]:443 ssl default_server;
#    server_name _;
#    ssl_reject_handshake on;
#    return 444;
#}

## HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name todo.example.com;
    return 301 https://$host$request_uri;
}

## HTTPS -> reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name todo.example.com;

    ## TLS
    ssl_certificate     /etc/ssl/certs/todo.example.com.pem;
    ssl_certificate_key /etc/ssl/private/todo.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ## Security headers (the app sets nosniff/frame/referrer itself — only
    ## what the upstream can't provide). The app sends its own HSTS without
    ## preload; two headers confuse browsers (they take the first), so only
    ## this one is passed through.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc                   'h3=":443"; ma=86400' always;

    ## Request bodies: 1 MB covers everything except images and backups. Large
    ## bodies only on exactly those two routes (below), and unbuffered there:
    ## buffered, nginx would first write every body to disk before the app can
    ## reject it — anonymously, in parallel, until the disk (and with it
    ## SQLite) is full. Unbuffered, the app answers 401 before reading it.
    client_max_body_size 1m;

    ## Passkeys need the Host header passed through. The proxy_* settings sit
    ## at server level so every location inherits them — proxy_set_header is
    ## only inherited as long as a location sets none of its own.
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_hide_header Connection;
    proxy_hide_header Keep-Alive;
    proxy_hide_header TE;
    proxy_hide_header Trailer;
    proxy_hide_header Transfer-Encoding;
    proxy_hide_header Upgrade;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    ## Image upload: 15 MB per image (maxAttachmentSize)
    location ~ ^/api/tasks/[0-9]+/attachments$ {
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    ## Backup import: up to 2 GB with images (maxImportBytes). After the upload
    ## the app still moves the images over in one transaction — for large
    ## backups that can take longer than nginx's default of 60s.
    location = /api/import {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
    }
}
